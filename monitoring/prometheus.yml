global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
  
  - job_name: 'fastapi-app'
    static_configs:
      - targets: ['app1:8000', 'app2:8000', 'app3:8000']
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-master:9187']